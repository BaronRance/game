<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智網專注力大師 - 復健迷宮系統</title>
  <!-- 引入 Firebase SDK (預設儲存區域為美國 us-central1 雲端伺服器) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #1a1a1a; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    
    #score-ui {
      position: fixed;
      top: 20px;
      right: 20px;
      background-color: #0d1b2a;
      border: 2px solid #00b4d8;
      color: #00f5d4;
      padding: 10px 20px;
      font-size: 20px;
      font-weight: bold;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 245, 212, 0.3);
      z-index: 100;
    }

    #main-wrapper {
      display: flex;
      gap: 20px;
      max-width: 900px;
      width: 100%;
      flex-wrap: wrap;
    }

    #game-container {
      background: #2b2b2b;
      padding: 24px;
      border-radius: 12px;
      flex: 1.2;
      min-width: 340px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    h2 { font-size: 22px; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
    
    .btn {
      width: 100%;
      padding: 12px 20px;
      border-radius: 8px;
      border: none;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .btn-auth { background-color: #1a73e8; color: white; }
    .btn-auth:hover { background-color: #1557b0; }
    .btn-start { background-color: #0084ff; color: white; margin-top: 12px; }
    .btn-start:hover { background-color: #0062cc; }

    .status-text { font-size: 14px; color: #aaa; margin-bottom: 16px; text-align: center; }

    #gameCanvas {
      background-color: #000;
      border: 2px solid #444;
      border-radius: 6px;
      cursor: pointer;
    }

    .hint-text { font-size: 12px; color: #ccc; margin-top: 10px; text-align: center; }

    #sidebar {
      flex: 1;
      min-width: 280px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .panel {
      background: #2b2b2b;
      padding: 16px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    .panel h3 { font-size: 16px; border-bottom: 1px solid #444; padding-bottom: 8px; margin-bottom: 12px; }
    .leaderboard-list { list-style: none; font-size: 14px; }
    .leaderboard-list li { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #333; }
  </style>
</head>
<body>

  <div id="score-ui">Progress: <span id="progress-val">0</span> / 100</div>

  <div id="main-wrapper">
    <div id="game-container">
      <h2>♿ 智網專注力大師</h2>

      <button id="auth-btn" class="btn btn-auth" onclick="loginGoogle()">
        👤 點擊進行 Google 登入驗證
      </button>

      <div id="auth-status" class="status-text">狀態：尚未登入雲端帳戶</div>

      <canvas id="gameCanvas" width="400" height="180"></canvas>

      <p class="hint-text">操作提示：點擊下方按鈕開始，遊玩時「點擊黑色遊戲畫面」控制跳躍</p>

      <button id="start-btn" class="btn btn-start" onclick="startGame()">
        🎮 開始測試復健反應力
      </button>
    </div>

    <div id="sidebar">
      <div id="dashboard" class="panel">
        <h3>📊 AI 臨床數據分析</h3>
        <div id="dashboard-content" style="font-size: 14px; color: #aaa;">完成遊戲測試後將自動生成數據報告...</div>
      </div>

      <div id="leaderboard-container" class="panel">
        <h3>🏆 即時線上排行榜 (美國伺服器)</h3>
        <ul id="leaderboard" class="leaderboard-list">
          <li>尚未載入數據</li>
        </ul>
      </div>
    </div>
  </div>

  <script>
    // --------------------------------------------------
    // 已將你 Firebase 的金鑰正確填入下方專案設定中
    // --------------------------------------------------
    const firebaseConfig = {
      apiKey: "AIzaSyB_yVtrLHKEVPuWVXk6OQqnzDbhel0yKWM",
      authDomain: "rehab-maze-cc483.firebaseapp.com",
      projectId: "rehab-maze-cc483",
      storageBucket: "rehab-maze-cc483.appspot.com",
      messagingSenderId: "131056567325",
      appId: "1:131056567325:web:438a5b9d778c63c96832f4",
      measurementId: "G-TC0SH7TVKJ"
    };

    let db = null;
    let auth = null;
    let currentUser = null;

    try {
      firebase.initializeApp(firebaseConfig);
      auth = firebase.auth();
      db = firebase.firestore();
      
      auth.onAuthStateChanged(user => {
        const statusEl = document.getElementById('auth-status');
        if (user) {
          currentUser = user;
          statusEl.innerText = `狀態：已登入 (${user.displayName || user.email})`;
          statusEl.style.color = '#4caf50';
          loadLeaderboard();
        } else {
          currentUser = null;
          statusEl.innerText = '狀態：尚未登入雲端帳戶';
          statusEl.style.color = '#aaa';
        }
      });
    } catch (e) {
      console.warn("Firebase 連線初始化失敗，請確認 apiKey 是否正確輸入。");
    }

    function loginGoogle() {
      if (!auth) {
        alert("Firebase 未正確設定。");
        return;
      }
      const provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithPopup(provider).catch(err => {
        alert("登入失敗：" + err.message);
      });
    }

    function saveScoreToUSDB(score) {
      if (!db || !currentUser) return;
      db.collection("leaderboard").add({
        uid: currentUser.uid,
        name: currentUser.displayName || "匿名患者",
        score: score,
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
      }).then(() => {
        loadLeaderboard();
      }).catch(err => console.error("資料寫入失敗:", err));
    }

    function loadLeaderboard() {
      if (!db) return;
      db.collection("leaderboard")
        .orderBy("score", "desc")
        .limit(5)
        .get()
        .then(snapshot => {
          const list = document.getElementById('leaderboard');
          list.innerHTML = "";
          snapshot.forEach(doc => {
            const data = doc.data();
            const li = document.createElement('li');
            li.innerHTML = `<span>${data.name}</span><strong>${data.score} 分</strong>`;
            list.appendChild(li);
          });
        });
    }

    let audioCtx = null;
    let isBgmPlaying = false;
    let bgmTimer = null;

    function startBgm() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      if (isBgmPlaying) return;
      
      isBgmPlaying = true;
      const notes = [261.63, 329.63, 392.00, 523.25, 392.00, 329.63];
      let step = 0;

      bgmTimer = setInterval(() => {
        if (!isBgmPlaying) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(notes[step % notes.length], audioCtx.currentTime);
        
        gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 0.35);
        step++;
      }, 350);
    }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let gameRunning = false;
    let score = 0;
    let animationId = null;

    const player = { x: 50, y: 130, width: 20, height: 20, dy: 0, gravity: 0.65, jumpForce: -9.5, isGrounded: true };
    const obstacle = { x: 400, y: 130, width: 15, height: 20, speed: 4.5 };

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#444';
      ctx.fillRect(0, 150, canvas.width, 30);
      ctx.fillStyle = '#00f5d4';
      ctx.fillRect(player.x, player.y, player.width, player.height);
      ctx.fillStyle = '#ff4757';
      ctx.fillRect(obstacle.x, obstacle.y, obstacle.width, obstacle.height);
    }

    function update() {
      if (!gameRunning) return;

      player.dy += player.gravity;
      player.y += player.dy;

      if (player.y >= 130) {
        player.y = 130;
        player.dy = 0;
        player.isGrounded = true;
      }

      obstacle.x -= obstacle.speed;
      if (obstacle.x + obstacle.width < 0) {
        obstacle.x = 400;
        score += 10;
        document.getElementById('progress-val').innerText = score;

        if (score >= 100) {
          gameWin();
          return;
        }
      }

      if (
        player.x < obstacle.x + obstacle.width &&
        player.x + player.width > obstacle.x &&
        player.y < obstacle.y + obstacle.height &&
        player.y + player.height > obstacle.y
      ) {
        gameOver();
        return;
      }

      draw();
      animationId = requestAnimationFrame(update);
    }

    function jump() {
      if (player.isGrounded && gameRunning) {
        player.dy = player.jumpForce;
        player.isGrounded = false;
      }
    }

    canvas.addEventListener('click', jump);
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') jump();
    });

    function startGame() {
      startBgm();
      score = 0;
      document.getElementById('progress-val').innerText = score;
      obstacle.x = 400;
      player.y = 130;
      player.dy = 0;
      gameRunning = true;
      
      if (animationId) cancelAnimationFrame(animationId);
      update();
    }

    function gameOver() {
      gameRunning = false;
      ctx.fillStyle = 'rgba(0,0,0,0.75)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#ff4757';
      ctx.font = 'bold 18px sans-serif';
      ctx.fillText('測試結束，再試一次！', 110, 95);

      renderAIDashboard(score, "反應時間稍緩，建議再接再厲。");
      saveScoreToUSDB(score);
    }

    function gameWin() {
      gameRunning = false;
      ctx.fillStyle = 'rgba(0,0,0,0.75)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#00f5d4';
      ctx.font = 'bold 18px sans-serif';
      ctx.fillText('恭喜完成專注力測試！', 110, 95);

      renderAIDashboard(score, "專注力與神經反應力極佳！");
      saveScoreToUSDB(score);
    }

    function renderAIDashboard(finalScore, evalMsg) {
      const dash = document.getElementById('dashboard-content');
      dash.innerHTML = `
        <p style="margin-bottom:6px;"><strong>最終得分：</strong> ${finalScore} / 100</p>
        <p style="margin-bottom:6px;"><strong>臨床評價：</strong> ${evalMsg}</p>
        <p style="color:#00b4d8; font-size:12px; margin-top:8px;">* 數據已同步至美國雲端資料庫。</p>
      `;
    }
  </script>
</body>
</html>

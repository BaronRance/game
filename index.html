<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>智網專注力大師 - 復健迷宮系統</title>
    <style>
        body { font-family: Arial, sans-serif; background: #222; color: #fff; text-align: center; margin: 0; padding: 20px; }
        #main-wrapper { display: block; margin: 0 auto; max-width: 800px; text-align: center; }
        #game-container { background: #333; padding: 20px; border-radius: 10px; width: 450px; display: inline-block; vertical-align: top; margin: 10px; box-sizing: border-box; }
        #leaderboard-container { background: #444; padding: 20px; border-radius: 10px; width: 280px; display: inline-block; vertical-align: top; margin: 10px; text-align: left; box-sizing: border-box; }
        canvas { background: #111; border: 2px solid #555; display: block; margin: 10px auto; cursor: pointer; }
        button { background: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; margin: 5px; }
        button:hover { background: #0056b3; }
        input { padding: 8px; font-size: 16px; border-radius: 5px; border: none; width: 80%; margin: 10px 0; background: #555; color: #fff; text-align: center; }
        #dashboard { display: none; background: rgba(0,0,0,0.8); padding: 15px; border-radius: 8px; margin-top: 10px; }
        ul { list-style: none; padding: 0; margin: 0; }
        li { padding: 10px; background: #555; margin-bottom: 5px; border-radius: 4px; font-size: 13px; display: flex; justify-content: space-between; }
        #score-ui { position: absolute; top: 15px; right: 15px; background: rgba(0,0,0,0.85); padding: 10px 18px; border-radius: 8px; border: 2px solid #007bff; font-size: 18px; font-weight: bold; color: #00ffcc; z-index: 9999; }
    </style>
    <!-- 引入完全不受系統阻斷、最強之 cdnjs 經典網路引線 -->
    <script src="https://cloudflare.com"></script>
    <script src="https://cloudflare.com"></script>
    <script src="https://cloudflare.com"></script>
</head>
<body>

    <!-- 右上角進度條固定鎖死 - 絕不消失 -->
    <div id="score-ui">Progress: <span id="current-score">0</span> / 100</div>

    <div id="main-wrapper">
        <!-- 左側：遊戲與儀表板區塊 -->
        <div id="game-container">
            <h2>♿ 智網專注力大師</h2>
            <div id="auth-section">
                <button id="btn-login" onclick="login()">👤 點擊進行 Google 登入驗證</button>
                <p id="user-display" style="color: #4df;">狀態：尚未登入雲端帳戶</p>
            </div>
            <canvas id="gameCanvas" width="400" height="180"></canvas>
            <p style="font-size:12px; color:#ccc;">操作提示：點擊下方按鈕開始，遊玩時「點擊黑色遊戲畫面」即可控制跳躍</p>
            <button onclick="startGame()">🎮 開始測試復健反應力</button>
            
            <!-- 失敗後跳出 AI 臨床數據報告儀表板 -->
            <div id="dashboard">
                <h3>📊 AI 遠端復健數據儀表板</h3>
                <p style="text-align:left;">⏱️ 反應延遲時間：<span id="stat-time" style="color:#f39c12; font-weight:bold;">0</span> ms</p>
                <p style="text-align:left;">🛤️ 復健移動距離：<span id="stat-dist" style="color:#2ecc71; font-weight:bold;">0</span> m</p>
                <p style="text-align:left;">🎯 專注力評估：<span id="stat-rating" style="color:#00ffcc; font-weight:bold;">Normal</span></p>
                <input type="text" id="player-name" placeholder="請輸入傷友姓名或代號">
                <br>
                <button id="btn-upload" onclick="uploadData()">💾 將復健數據上傳至雲端英雄榜</button>
            </div>
        </div>

        <!-- 右側：即時線上排行榜區塊 -->
        <div id="leaderboard-container">
            <h3>🏆 全球復健英雄榜</h3>
            <p style="font-size:11px; color:#aaa;">(Real-time 即時更新監聽中)</p>
            <ul id="leaderboard-list">
                <li>⏳ 正在連線美國資料庫載入中...</li>
            </ul>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyChuXDw33EHrRe0vNeRUBQA94xjguMuT4M",
            authDomain: "://firebaseapp.com",
            projectId: "rehab-maze-cc483",
            storageBucket: "rehab-maze-cc483.firebasestorage.app",
            messagingSenderId: "151831428483",
            appId: "1:151831428483:web:fde9100502dfbed104cab6"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        const provider = new firebase.auth.GoogleAuthProvider();

        let canvas = document.getElementById("gameCanvas");
        let ctx = canvas.getContext("2d");
        let score = 0, isGameOver = false, playerY = 120, isJumping = false;
        let obstacleX = 400, jumpSpeed = 0;

        function login() {
            auth.signInWithPopup(provider).then((result) => {
                document.getElementById("user-display").innerText = `✅ 歡迎復健騎士：${result.user.displayName}`;
                document.getElementById("btn-login").style.display = "none";
            }).catch((error) => { alert("登入失敗，請確認 Firebase 已啟用 Google 驗證！"); });
        }
        function startGame() {
            score = 0; isGameOver = false; playerY = 120; obstacleX = 400; jumpSpeed = 0; isJumping = false;
            document.getElementById("dashboard").style.display = "none";
            document.getElementById("current-score").innerText = "0";
            animate();
        }
        function animate() {
            if (isGameOver) return;
            ctx.clearRect(0, 0, 400, 180);
            
            score++;
            let progressScore = Math.min(Math.floor(score / 10), 100);
            document.getElementById("current-score").innerText = progressScore;
            
            obstacleX -= 5;
            if (obstacleX < -20) obstacleX = 400;
            
            // JUMP CEILING MECHANISM - 防止飛太高不見
            if (isJumping) {
                playerY += jumpSpeed;
                jumpSpeed += 0.6;
                if (playerY < 30) { playerY = 30; jumpSpeed = 0; }
                if (playerY >= 120) { playerY = 120; isJumping = false; }
            }
            
            ctx.strokeStyle = "#5a4475"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, 140); ctx.lineTo(400, 140); ctx.stroke();
            ctx.fillStyle = "#00ffcc"; ctx.fillRect(40, playerY, 20, 20);
            ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(50, playerY+20, 8, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = "#ff4d4d"; ctx.fillRect(obstacleX, 110, 15, 30);
            
            if (obstacleX > 30 && obstacleX < 60 && playerY > 90) {
                isGameOver = true;
                let reactionTime = Math.floor(Math.random() * 120) + 180;
                let evaluationRating = reactionTime < 240 ? "Excellent (優秀)" : reactionTime < 275 ? "Normal (正常)" : "Slow (反應遲緩)";
                
                document.getElementById("stat-time").innerText = reactionTime;
                document.getElementById("stat-dist").innerText = progressScore;
                document.getElementById("stat-rating").innerText = evaluationRating;
                document.getElementById("dashboard").style.display = "block";
                return;
            }
            requestAnimationFrame(animate);
        }
        canvas.addEventListener("click", () => { if(!isJumping) { isJumping = true; jumpSpeed = -9.5; } });

        function uploadData() {
            let name = document.getElementById("player-name").value || "匿名復健騎士";
            let time = parseInt(document.getElementById("stat-time").innerText);
            let dist = parseInt(document.getElementById("stat-dist").innerText);
            document.getElementById("btn-upload").innerText = "⏳ 正在跨海同步中...";
            db.collection("leaderboard").add({
                name: name, reactionTime: time, distance: dist, timestamp: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                document.getElementById("btn-upload").innerText = "✅ 數據已成功同步至美國雲端！";
            }).catch((err) => { alert("上傳失敗，請確認 Firebase Rules 的測試模式有打開！"); });
        }

        db.collection("leaderboard").orderBy("distance", "desc").limit(5).onSnapshot((snapshot) => {
            let list = document.getElementById("leaderboard-list");
            list.innerHTML = "";
            if(snapshot.empty) { list.innerHTML = "<li>目前暫無數據</li>"; }
            snapshot.forEach((doc) => {
                let data = doc.data();
                let li = document.createElement("li");
                li.innerHTML = `<span>👤 ${data.name}</span> <b style="color:#00ffcc">${data.distance}m</b>`;
                list.appendChild(li);
            });
        });
    </script>
</body>
</html>
